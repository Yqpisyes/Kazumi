name: 构建 ARM v7a 安卓包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          # 修复点：明确指定使用稳定通道 (channel) 而不是版本号
          channel: 'stable'
          cache: true

      - name: 下载项目依赖
        run: flutter pub get

      - name: 执行编译 (ARM v7a)
        # 针对安卓 8 可能需要的额外参数
        run: flutter build apk --target-platform android-arm --release --no-tree-shake-icons

      - name: 上传生成的 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: Kazumi-安卓8-32位版
          path: build/app/outputs/flutter-apk/app-release.apk

