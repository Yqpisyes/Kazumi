name: 构建针对安卓8优化的v7a版本

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 强制修改安卓最低版本
        # 这一步非常重要，它会把项目默认的 minSdkVersion 改为 26 (Android 8)
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 26/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 26/' android/local.properties || true

      - name: 下载并升级依赖
        run: |
          flutter pub get

      - name: 执行编译 (ARM v7a)
        # 删除了报错的 --no-impeller 参数
        run: |
          flutter build apk --target-platform android-arm --release --no-tree-shake-icons

      - name: 上传修复后的 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazumi-Android8-Fixed
          path: build/app/outputs/flutter-apk/app-release.apk
