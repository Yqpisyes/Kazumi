name: 构建针对安卓8优化的v7a版本

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive # 确保拉取了播放器依赖的原生库源码

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 下载并升级依赖
        run: |
          flutter pub get
          flutter pub upgrade

      - name: 执行兼容性编译 (ARM v7a)
        # --no-impeller: 解决老旧安卓系统上的渲染冲突闪退
        # --no-tree-shake-icons: 避免图标资源导致构建错误
        run: |
          flutter build apk --target-platform android-arm --release --no-tree-shake-icons --no-impeller

      - name: 上传修复后的 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazumi-Android8-Fixed
          path: build/app/outputs/flutter-apk/app-release.apk
